<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile setup — Employee Allocation System</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar">
    <h2>Allocation System</h2>
    <a href="employee-dashboard.html" style="text-decoration:none;"><div class="nav-item">My dashboard</div></a>
    <div class="nav-item active">Edit my profile</div>
    <div class="logout" onclick="logout()">Log out</div>
  </div>

  <div class="main-content narrow-content">
    <div class="topbar">
      <h1>Profile setup</h1>
      <div class="user-chip" id="user-chip"></div>
    </div>

    <div id="error-banner" class="error-banner"></div>

    <div class="card" style="margin-bottom:20px;">
      <p class="section-title">Basic details</p>
      <form id="profile-form">
        <div class="form-row">
          <div><label>Full name</label><input id="p-name" required></div>
          <div><label>Phone</label><input id="p-phone"></div>
        </div>
        <div class="form-row">
          <div><label>Designation</label><input id="p-designation" required></div>
          <div>
            <label>Availability</label>
            <select id="p-status">
              <option>Available</option><option>Partially Allocated</option>
              <option>Fully Allocated</option><option>On Leave</option>
            </select>
          </div>
        </div>
        <label>Years of experience</label>
        <input id="p-exp" type="number" step="0.5" min="0" style="max-width:160px;">
        <button type="submit" class="btn-primary">Save details</button>
      </form>
    </div>

    <div class="card">
      <p class="section-title">My skills</p>
      <div id="skills-list" style="margin-bottom:16px;"></div>

      <form id="add-skill-form">
        <div class="form-row">
          <div><label>Skill</label><select id="new-skill-id" required></select></div>
          <div>
            <label>Proficiency</label>
            <select id="new-skill-level">
              <option value="1">Beginner</option><option value="2">Intermediate</option>
              <option value="3" selected>Advanced</option><option value="4">Expert</option>
            </select>
          </div>
          <div><label>Years in this skill</label><input id="new-skill-years" type="number" step="0.5" min="0" value="0"></div>
        </div>
        <label style="display:flex; align-items:center; gap:6px; margin-bottom:14px;">
          <input type="checkbox" id="new-skill-cert" style="width:auto; margin:0;"> Certified
        </label>
        <button type="submit" class="btn-secondary">+ Add / update skill</button>
      </form>
    </div>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/profile.js"></script>
</body>
</html>
